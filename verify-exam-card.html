<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ClassLink - Verify Examination Card
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <header class="dashboard-header">

        <div class="dashboard-logo">
            ClassLink
        </div>

        <div>
            Examination Card Verification
        </div>

    </header>


    <main class="dashboard-container">

        <section class="modern-card">

            <div class="card-heading">

                <div>

                    <h2>
                        🎫 Examination Card Verification
                    </h2>

                    <p>
                        Verify the authenticity of a ClassLink examination card.
                    </p>

                </div>

            </div>


            <div id="verificationResult">

                <p class="empty-state">
                    Enter an examination card number to verify it.
                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/verify-exam-card.js"
    ></script>

</body>

</html>
