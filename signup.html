<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClassLink - Create Account</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-brand">

                <h1>ClassLink</h1>

                <p>Connect. Learn. Succeed.</p>

            </div>


            <h2>Create your account</h2>

            <p class="auth-subtitle">
                Join ClassLink today
            </p>


            <form id="signupForm">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <p class="role-hint">
    Choose the account type that matches you.
</p>

                <label for="role">
                    I am a:
                </label>

                <select id="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="lecturer">
                        Lecturer
                    </option>

                </select>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p id="message"></p>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p class="auth-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </div>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
