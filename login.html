<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClassLink - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

    <div class="auth-card">

    <header>
        <div class="logo">ClassLink</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="signup.html">Create Account</a>
        </nav>
    </header>


    <main>

        <section class="signup-container">

            <div class="signup-box">

                <h1>Welcome back</h1>

                <p>Login to your ClassLink account</p>


                <form id="loginForm">

                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p id="loginMessage"></p>


                <p class="login-link">
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

                <p class="auth-home">
                    <a href="index.html">
                        ← Back to Home
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script type="module" src="js/app.js"></script>

    </div>

</div>

</body>

</html>
