<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClassLink - Examination Card</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="dashboard-header">

        <div class="dashboard-logo">
            ClassLink
        </div>

        <div>
            Examination Card
        </div>

    </header>


    <main class="dashboard-container">

        <section class="modern-card">

            <div class="card-heading">

                <div>
                    <h2>
                        🎫 Examination Card
                    </h2>

                    <p>
                        Official examination registration card
                    </p>
                </div>

            </div>


            <div id="examCardContent">

                <p class="empty-state">
                    Loading examination card...
                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/exam-card.js"
    ></script>

</body>

</html>
