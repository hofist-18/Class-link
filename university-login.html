<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Login - ClassLink</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="home-page">

    <header>

        <div class="logo">
            ClassLink
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </nav>

    </header>


    <main class="university-login-page">

        <section class="university-login-card">

            <div class="university-login-icon">
                🎓
            </div>

            <span class="section-label">
                UNIVERSITY LEARNING PORTAL
            </span>

            <h1>
                Welcome to ClassLink
            </h1>

            <h2 id="selectedUniversityName">
                Loading university...
            </h2>

            <p>
                Log in to access your university learning portal.
            </p>


            <form id="loginForm">

                <!-- UNIVERSITY -->

                <div class="login-field">

                    <label for="loginUniversity">
                        Selected University
                    </label>

                    <select
                        id="loginUniversity"
                        required
                    >

                        <option value="">
                            Loading university...
                        </option>

                    </select>

                </div>


                <!-- EMAIL -->

                <div class="login-field">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="login-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="login-password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleLoginPassword"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <p
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></p>


                <button
                    type="submit"
                    class="university-login-button"
                >
                    Log In →
                </button>

            </form>


            <div class="university-login-links">

                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create Account
                    </a>
                </p>

                <a href="index.html">
                    ← Choose another university
                </a>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/app.js"
    ></script>

    <script
        type="module"
        src="js/university-login.js"
    ></script>

</body>

</html>
